<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; font-family: sans-serif; padding: 10px; }
    input { width: 100%; margin-bottom: 10px; padding: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 8px; background-color: #714B67; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #5d3d54; }
    .status { margin-top: 10px; font-size: 12px; color: green; display: none; }
  </style>
</head>
<body>
  <h3>Caisse-AP Bridge Config</h3>
  <label for="url">Bridge API URL:</label>
  <input type="text" id="url" placeholder="http://127.0.0.1:8080/pay">
  <button id="save">Save Configuration</button>
  <div id="status" class="status">Saved!</div>
  <script src="popup.js"></script>
</body>
</html>
